<style>/* GX Fitness — shared look. Tokens mirror DESIGN.md */
.gx{font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.gx *,.gx *::before,.gx *::after{box-sizing:border-box}
.gx a{color:inherit;text-decoration:none}
.gx h1,.gx h2,.gx h3,.gx p{margin:0}
.gx button,.gx input{font:inherit;color:inherit}

.t-dark{--brand:#F01425;--brand-hover:#FF2D3B;--brand-soft:rgba(240,20,37,.14);--brand-text:#FF4D57;--bg:#0A0A0B;--surface:#141416;--raised:#1C1C1F;--line:#26262A;--text:#F5F5F6;--muted:#9A9AA3;--shadow:0 8px 24px rgba(0,0,0,.35);--glow:0 0 28px rgba(240,20,37,.38);--ok:#22C55E;--bad:#F87171;--hatch:rgba(255,255,255,.028);--fade:10,10,11}
.t-light{--brand:#E20D1B;--brand-hover:#C40A17;--brand-soft:rgba(226,13,27,.08);--brand-text:#C40A17;--bg:#F4F5F7;--surface:#FFFFFF;--raised:#F6F7F9;--line:#E6E8EC;--text:#0F1115;--muted:#5B6370;--shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px rgba(16,24,40,.07);--glow:0 6px 18px rgba(226,13,27,.28);--ok:#16A34A;--bad:#DC2626;--hatch:rgba(0,0,0,.03);--fade:244,245,247}

.t-dark.atmo{background:radial-gradient(900px 520px at 0% -8%,rgba(240,20,37,.20),transparent 62%),radial-gradient(800px 520px at 100% 108%,rgba(240,20,37,.10),transparent 62%),#0A0A0B}
.t-light.atmo{background:radial-gradient(900px 520px at 0% -8%,rgba(226,13,27,.10),transparent 62%),radial-gradient(800px 520px at 100% 108%,rgba(23,30,36,.07),transparent 62%),#F4F5F7}
.texture{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,var(--hatch) 0 1px,transparent 1px 7px)}
.slash{position:absolute;pointer-events:none;transform:skewX(-22deg);background:linear-gradient(180deg,var(--brand),rgba(0,0,0,0))}
.display{font-family:'Barlow Condensed',Impact,sans-serif;font-style:italic;font-weight:700;letter-spacing:.01em}
.muted{color:var(--muted)}
.brand-text{color:var(--brand-text)}

/* shell */
.shell{display:flex;flex-wrap:wrap;min-height:100%;position:relative}
.side{flex:0 0 248px;padding:20px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface);border-right:1px solid var(--line);position:relative;z-index:2}
.t-dark .side{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 40%),#101012}
.logo-crop{overflow:hidden;width:176px;height:110px;margin:2px 0 14px 6px;flex:none}
.logo-crop img{display:block;width:176px;height:auto;margin-top:-3px}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:12px;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.nav:hover{background:var(--raised);color:var(--text)}
.nav.on{background:var(--brand);color:#fff;box-shadow:var(--glow)}
.nav svg{flex:none}
.nav .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:#fff}
.side-foot{margin-top:auto;padding:14px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.main{flex:999 1 560px;min-width:0;padding:24px 32px 40px;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top .title{flex:1 1 240px}
.h1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);position:relative;cursor:pointer}
.iconbtn .ping{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.userchip{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px 0 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:60% 18%}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:relative}
.t-dark .card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60%),var(--surface)}
.card-pad{padding:20px}
.h2{font-size:18px;line-height:24px;font-weight:600}
.row{display:flex;align-items:center;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{padding:18px 20px;display:flex;align-items:center;gap:16px}
.kpi .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.kpi .num{font-size:32px;line-height:36px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .lbl{font-size:12px;line-height:16px;font-weight:500;color:var(--muted)}
.delta{font-size:12px;font-weight:600;color:var(--ok);display:inline-flex;align-items:center;gap:2px}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600}
.b-ok{background:rgba(34,197,94,.14);color:var(--ok)}
.b-warn{background:rgba(245,158,11,.16);color:#D97706}
.t-dark .b-warn{color:#F59E0B}
.b-off{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:background .15s,box-shadow .15s}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--glow)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn-sm{height:36px;padding:0 14px;font-size:13px}
.input{width:100%;height:48px;padding:0 16px;border-radius:12px;background:var(--raised);border:1px solid var(--line);outline:none;color:var(--text)}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input::placeholder{color:var(--muted)}
.label{display:block;font-size:12px;font-weight:600;margin-bottom:8px;color:var(--muted);letter-spacing:.02em}
.class-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:var(--raised);border:1px solid var(--line)}
.class-row .ico{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:6px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);width:fit-content;max-width:100%;overflow-x:auto}
.tab{height:36px;padding:0 16px;border-radius:9px;display:inline-flex;align-items:center;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--brand);color:#fff}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:14px 20px;border-bottom:1px solid var(--line);letter-spacing:.03em;text-transform:uppercase}
.tbl td{padding:14px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--raised)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:120px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}

/* hero banner inside the app */
.welcome{overflow:hidden;min-height:176px;display:flex;align-items:center;padding:28px 32px;border-radius:20px;position:relative;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
.welcome .photo{position:absolute;right:0;top:0;bottom:0;width:58%;object-fit:cover;object-position:60% 14%}
.welcome .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgb(var(--fade)) 0%,rgba(var(--fade),.92) 38%,rgba(var(--fade),.2) 72%,rgba(var(--fade),0) 100%)}
.welcome .slash{opacity:.9}

/* mobile */
.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;justify-content:space-around;align-items:center;padding:0 12px 6px;background:var(--surface);border-top:1px solid var(--line);z-index:5}
.bn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);min-width:64px}
.bn.on{color:var(--brand-text)}
.bn.on .pill{background:var(--brand);color:#fff;box-shadow:var(--glow)}
.bn .pill{width:44px;height:30px;border-radius:999px;display:grid;place-items:center}
</style>
</head>
